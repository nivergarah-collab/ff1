# Integracion continua de ff1. Sin verificar en GitHub todavia.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Verificar estructura del proyecto
        shell: pwsh
        run: ./scripts/verificar-estructura.ps1

      - name: Pruebas unitarias
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain -q
